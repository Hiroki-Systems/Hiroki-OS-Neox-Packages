name: Update HirokiOS repository database

"on":
  push:
    paths:
      - "x86_64/*.pkg.tar.zst"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-db:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository tools
        run: |
          pacman -Syu --noconfirm --needed git pacman

      - name: Rebuild repository database
        run: |
          cd "$GITHUB_WORKSPACE"

          shopt -s nullglob
          packages=(x86_64/*.pkg.tar.zst)

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No packages found; database was not changed."
            exit 0
          fi

          repo-add x86_64/hiroki.db.tar.gz "${packages[@]}"

          # repo-add sembolik link oluşturabilir.
          # GitHub Pages için normal dosya oluştur.
          rm -f x86_64/hiroki.db
          cp x86_64/hiroki.db.tar.gz x86_64/hiroki.db

          rm -f x86_64/hiroki.files

          if [ -f x86_64/hiroki.files.tar.gz ]; then
            cp x86_64/hiroki.files.tar.gz x86_64/hiroki.files
          fi

      - name: Commit updated database
        run: |
          cd "$GITHUB_WORKSPACE"

          test -d .git

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A x86_64/

          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update HirokiOS repository database"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

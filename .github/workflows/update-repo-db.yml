name: Update HirokiOS repository database

"on":
  push:
    paths:
      - "x86_64/*.pkg.tar.zst"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-db:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository tools
        run: |
          pacman -Syu --noconfirm --needed git pacman

      - name: Rebuild repository database
        run: |
          cd "$GITHUB_WORKSPACE"

          shopt -s nullglob
          packages=(x86_64/*.pkg.tar.zst)

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No packages found; database was not changed."
            exit 0
          fi

          repo-add x86_64/hiroki.db.tar.gz "${packages[@]}"

          # repo-add sembolik link oluşturabilir.
          # GitHub Pages için normal dosya oluştur.
          rm -f x86_64/hiroki.db x86_64/HirokiOS.db
          cp x86_64/hiroki.db.tar.gz x86_64/hiroki.db
          cp x86_64/hiroki.db.tar.gz x86_64/HirokiOS.db

          rm -f x86_64/hiroki.files x86_64/HirokiOS.files

          if [ -f x86_64/hiroki.files.tar.gz ]; then
            cp x86_64/hiroki.files.tar.gz x86_64/hiroki.files
            cp x86_64/hiroki.files.tar.gz x86_64/HirokiOS.files
          fi

          # repo-add yedek dosyalarını Git'e dahil etme.
          rm -f x86_64/*.old

      - name: Commit updated database
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"

          # Arch container, git kurulmadan önce checkout yapıldığı için
          # checkout dosyaları .git olmadan gelebilir. Repo geçmişini
          # kurmadan önce git'i kurup yeniden bağlıyoruz.
          git init -b "${GITHUB_REF_NAME:-main}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_REF_NAME:-main}:refs/remotes/origin/${GITHUB_REF_NAME:-main}"
          git reset --mixed "origin/${GITHUB_REF_NAME:-main}"

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- x86_64
          git status --short
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update HirokiOS repository database"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME:-main}"
          fi
